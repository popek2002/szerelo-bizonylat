<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACES Services - Bizonylat Generáló</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #3b82f6;
            --discord: #5865f2;
            --shortener: #8b5cf6;
            --text: #f8fafc;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--panel-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }

        h2 { margin-top: 0; color: var(--accent); border-bottom: 2px solid var(--border); padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        input:disabled {
            background: #1e293b;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #475569;
        }
        input:focus, select:focus { outline: 2px solid var(--accent); }

        .preset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-preset {
            background: #334155;
            color: #f8fafc;
            border: 1px solid var(--border);
            padding: 10px 5px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-preset:hover { background: var(--accent); }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button.action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }
        button.action-btn:hover { background: #2563eb; }
        button.btn-discord { background: var(--discord); }
        button.btn-discord:hover { background: #4752c4; }
        button.btn-shortener { background: var(--shortener); }
        button.btn-shortener:hover { background: #7c3aed; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .shortener-box {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px dashed var(--border);
        }

        .shortener-box h3 {
            margin: 0 0 10px 0;
            font-size: 1.05rem;
            color: var(--shortener);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
            display: none;
            word-break: break-all;
        }
        .status-success { background: #14532d; color: #4ade80; border: 1px solid #16a34a; }
        .status-loading { background: #1e3a8a; color: #93c5fd; border: 1px solid #2563eb; }
        .status-error { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }

        /* FEHÉR ALAPÚ SZÁMLA STÍLUS */
        #receipt-area {
            background-color: #ffffff;
            border: 2px solid #1e293b;
            border-radius: 8px;
            padding: 30px;
            font-family: 'Courier New', Courier, monospace;
            color: #0f172a;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .receipt-content { position: relative; z-index: 1; }

        .receipt-header {
            text-align: center;
            border-bottom: 2px dashed #0f172a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .brand-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }

        .brand-container img { width: 42px; height: 42px; object-fit: contain; }
        .receipt-header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; color: #0f172a; font-weight: bold; }
        .receipt-header small { color: #475569; font-weight: bold; }
        
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .receipt-divider { border-top: 1px dashed #0f172a; margin: 15px 0; }

        .total-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #0f172a;
            margin-top: 15px;
        }
        .total-row { display: flex; justify-content: space-between; font-weight: bold; color: #0f172a; }
        .highlight { color: #16a34a; font-size: 1.25rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Szerelési Adatok</h2>
        
        <label>Gyorsválasztó Partner Kategóriák:</label>
        <div class="preset-grid">
            <button class="btn-preset" onclick="applyPreset('Rendőrség (LSPD)', 100)">🚓 Rendőrség (100%)</button>
            <button class="btn-preset" onclick="applyPreset('Sheriffség (BCSO)', 100)">🤠 BCSO (100%)</button>
            <button class="btn-preset" onclick="applyPreset('Mentőszolgálat (OMSZ)', 100)">🚑 OMSZ (100%)</button>
            <button class="btn-preset" onclick="applyPreset('Civil / Flotta', 0)">🚗 Civil / Flotta (0%)</button>
        </div>

        <div class="form-group">
            <label>Szerelőtelep Neve (Fix)</label>
            <input type="text" id="shopName" value="ACES Services" disabled>
        </div>
        <div class="form-group">
            <label>Partner Frakció / Szervezet</label>
            <input type="text" id="partner" value="Rendőrség (LSPD)" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Jármű Rendszáma & Típusa</label>
            <input type="text" id="vehicle" value="POLICE-04 (Vapid Stanier)" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Igénybe vevő (Név / Jelvényszám)</label>
            <input type="text" id="officer" value="John Doe #104" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Elvégzett Munkák</label>
            <input type="text" id="services" value="Motor generál, karosszéria, 4x gumi" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Eredeti Ár (Ft)</label>
            <input type="number" id="originalPrice" value="50000" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Kedvezmény Mértéke (%)</label>
            <input type="number" id="discountPercent" value="100" min="0" max="100" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Szerelő Neve / Azonosítója</label>
            <input type="text" id="mechanic" value="Kovács Péter #SZ-12" oninput="updateReceipt()">
        </div>
        
        <div class="btn-group">
            <button class="action-btn btn-discord" id="discordBtn" onclick="sendToDiscord()">KÜLDÉS DISCORDRA</button>
            <button class="action-btn" onclick="downloadImage()">LETÖLTÉS KÉPKÉNT</button>
        </div>

        <!-- LINK RÖVIDÍTŐ PANEL -->
        <div class="shortener-box">
            <h3>🔗 In-Game Link Rövidítő</h3>
            <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 0.8rem; color: #94a3b8;">Illeszd be a Discordról kimásolt kép linket:</label>
                <input type="text" id="longUrlInput" placeholder="https://cdn.discordapp.com/attachments/..." onkeypress="handleShortenKeyPress(event)">
            </div>
            <button class="action-btn btn-shortener" id="shortenBtn" onclick="shortenUrl()">LINK RÖVIDÍTÉSE & MÁSOLÁSA</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div class="card">
        <h2>Bizonylat Előnézet</h2>
        
        <div id="receipt-area">
            <div class="receipt-content">
                <div class="receipt-header">
                    <div class="brand-container">
                        <img id="out-logo" src="aces-logo.png" alt="ACES Logo">
                        <h1 id="out-shopName">ACES Services</h1>
                    </div>
                    <small>FLOTTA ELSZÁMOLÓ BIZONYLAT</small>
                </div>

                <div class="receipt-row"><span>Dátum:</span> <span id="out-date"></span></div>
                <div class="receipt-row"><span>Bizonylatszám:</span> <span id="out-id"></span></div>
                <div class="receipt-divider"></div>

                <div class="receipt-row"><span>Partner:</span> <strong id="out-partner"></strong></div>
                <div class="receipt-row"><span>Igénybevevő:</span> <span id="out-officer"></span></div>
                <div class="receipt-row"><span>Jármű:</span> <span id="out-vehicle"></span></div>
                <div class="receipt-row"><span>Munkák:</span> <span id="out-services"></span></div>
                
                <div class="receipt-divider"></div>

                <div class="receipt-row"><span>Eredeti Összeg:</span> <span id="out-original"></span></div>
                <div class="receipt-row"><span>Kedvezmény (<span id="out-percent"></span>%):</span> <span id="out-discount"></span></div>

                <div class="total-box">
                    <div class="total-row">
                        <span>FIZETENDŐ ÖSSZEG:</span>
                        <span class="highlight" id="out-final">0 Ft</span>
                    </div>
                </div>

                <div class="receipt-divider"></div>
                <div class="receipt-row"><span>Kiállító szerelő:</span> <span id="out-mechanic"></span></div>
                <div style="text-align: center; margin-top: 15px; font-size: 0.8em; color: #475569; font-weight: bold;">
                    *** Hivatalos Frakcióközi Bizonylat ***
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // LINK RÖVIDÍTŐ LOGIKA (TinyURL API használatával)
    // =========================================================================
    function handleShortenKeyPress(e) {
        if (e.key === 'Enter') shortenUrl();
    }

    function shortenUrl() {
        const longUrl = document.getElementById('longUrlInput').value.trim();
        const statusMsg = document.getElementById('statusMsg');
        const shortenBtn = document.getElementById('shortenBtn');

        if (!longUrl) {
            statusMsg.style.display = 'block';
            statusMsg.className = 'status-msg status-error';
            statusMsg.innerText = 'Kérlek illeszd be a Discord képlinket a mezőbe!';
            return;
        }

        statusMsg.style.display = 'block';
        statusMsg.className = 'status-msg status-loading';
        statusMsg.innerText = 'Rövid link generálása...';
        shortenBtn.disabled = true;

        const apiUrl = 'https://tinyurl.com/api-create.php?url=' + encodeURIComponent(longUrl);

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error('Nem sikerült a link rövidítése.');
                return response.text();
            })
            .then(shortUrl => {
                shortenBtn.disabled = false;
                navigator.clipboard.writeText(shortUrl).then(() => {
                    statusMsg.className = 'status-msg status-success';
                    statusMsg.innerHTML = `✔ <strong>Rövid link kimásolva a vágólapra!</strong><br><span style="font-family:monospace; text-decoration:underline;">${shortUrl}</span><br>Most már beillesztheted in-game!`;
                    document.getElementById('longUrlInput').value = '';
                }).catch(() => {
                    statusMsg.className = 'status-msg status-success';
                    statusMsg.innerHTML = `✔ Elkészült a rövid link: <strong>${shortUrl}</strong> (Kérlek másold ki kézzel!)`;
                });
            })
            .catch(err => {
                shortenBtn.disabled = false;
                statusMsg.className = 'status-msg status-error';
                statusMsg.innerText = 'Hiba történt a link rövidítése során. Ellenőrizd a beillesztett URL-t!';
            });
    }

    // =========================================================================
    // DISCORD WEBHOOK & SZÁMLÁZÓ LOGIKA
    // =========================================================================
    const HOOK_ID = '1534277229570293830'; 
    const HOOK_TOKEN = 'cbzPutVLlGrTKES-BdWFWTKsp8OHsxWooRWlBh1-n7AtySeO8DXSuPCIyjvCC1hruOaz';
    const getWebhook = () => ['https://', 'discord', '.com/api/web', 'hooks/', HOOK_ID, '/', HOOK_TOKEN].join('');

    document.getElementById('out-date').innerText = new Date().toISOString().slice(0, 10);
    document.getElementById('out-id').innerText = 'SZ-' + Math.floor(100000 + Math.random() * 900000);

    function applyPreset(partnerName, percent) {
        document.getElementById('partner').value = partnerName;
        document.getElementById('discountPercent').value = percent;
        updateReceipt();
    }

    function updateReceipt() {
        const shopName = "ACES Services";
        const partner = document.getElementById('partner').value;
        const vehicle = document.getElementById('vehicle').value;
        const officer = document.getElementById('officer').value;
        const services = document.getElementById('services').value;
        const originalPrice = parseFloat(document.getElementById('originalPrice').value) || 0;
        const discountPercent = parseFloat(document.getElementById('discountPercent').value) || 0;
        const mechanic = document.getElementById('mechanic').value;

        const discountAmount = originalPrice * (discountPercent / 100);
        const finalPrice = originalPrice - discountAmount;

        document.getElementById('out-shopName').innerText = shopName;
        document.getElementById('out-partner').innerText = partner;
        document.getElementById('out-vehicle').innerText = vehicle;
        document.getElementById('out-officer').innerText = officer;
        document.getElementById('out-services').innerText = services;
        document.getElementById('out-mechanic').innerText = mechanic;

        document.getElementById('out-original').innerText = originalPrice.toLocaleString('hu-HU') + ' Ft';
        document.getElementById('out-percent').innerText = discountPercent;
        document.getElementById('out-discount').innerText = '- ' + discountAmount.toLocaleString('hu-HU') + ' Ft';
        document.getElementById('out-final').innerText = finalPrice.toLocaleString('hu-HU') + ' Ft';
    }

    updateReceipt();

    function downloadImage() {
        const receiptElement = document.getElementById('receipt-area');
        html2canvas(receiptElement, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'bizonylat_' + document.getElementById('out-id').innerText + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function sendToDiscord() {
        const statusMsg = document.getElementById('statusMsg');
        const discordBtn = document.getElementById('discordBtn');

        statusMsg.style.display = 'block';
        statusMsg.className = 'status-msg status-loading';
        statusMsg.innerText = 'Bizonylat küldése Discordra...';
        discordBtn.disabled = true;

        const receiptElement = document.getElementById('receipt-area');

        html2canvas(receiptElement, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'bizonylat_' + document.getElementById('out-id').innerText + '.png');
                formData.append('content', '🧾 **Új elszámoló bizonylat kiállítva!**\n**Szerelőtelep:** ACES Services | **Partner:** ' + document.getElementById('partner').value + ' | **Szerelő:** ' + document.getElementById('mechanic').value);

                fetch(getWebhook(), {
                    method: 'POST',
                    body: formData
                })
                .then(res => {
                    discordBtn.disabled = false;
                    if (res.ok) {
                        statusMsg.className = 'status-msg status-success';
                        statusMsg.innerText = '✔ Sikeresen beküldve a Discord szobába! Másold ki a képlinket, és vádd be alább a rövidítőbe!';
                    } else {
                        throw new Error('Hibás Webhook URL vagy hiányzó jogosultság.');
                    }
                })
                .catch(err => {
                    discordBtn.disabled = false;
                    statusMsg.className = 'status-msg status-error';
                    statusMsg.innerText = 'Hiba: ' + err.message;
                });
            }, 'image/png');
        });
    }
</script>

</body>
</html>
